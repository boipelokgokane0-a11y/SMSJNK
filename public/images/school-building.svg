<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050e26"/>
      <stop offset="60%" stop-color="#0a1d4d"/>
      <stop offset="100%" stop-color="#122b68"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wallPillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f286b"/>
      <stop offset="100%" stop-color="#081538"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky & Ambient Glow -->
  <rect width="1200" height="700" fill="url(#skyGrad)"/>
  <circle cx="600" cy="180" r="320" fill="#22d3ee" opacity="0.08" filter="url(#glow)"/>

  <!-- Stars / Digital Sparkles -->
  <g fill="#bae6fd" opacity="0.6">
    <circle cx="120" cy="80" r="1.5"/><circle cx="280" cy="60" r="1.2"/>
    <circle cx="450" cy="90" r="1.8"/><circle cx="750" cy="70" r="1.5"/>
    <circle cx="920" cy="85" r="1.2"/><circle cx="1080" cy="65" r="1.6"/>
  </g>

  <!-- Distant Background Academic Wings -->
  <rect x="180" y="240" width="840" height="180" fill="#0b1b42" rx="4"/>
  <polygon points="180,240 600,190 1020,240" fill="#081433"/>

  <!-- Left Academic Wing -->
  <rect x="100" y="270" width="320" height="230" fill="url(#wallGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
  <polygon points="90,270 260,210 430,270" fill="url(#roofGrad)" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Left Wing Windows (Row 1) -->
  <g fill="url(#glassGrad)">
    <rect x="130" y="290" width="40" height="55" rx="3"/>
    <rect x="190" y="290" width="40" height="55" rx="3"/>
    <rect x="250" y="290" width="40" height="55" rx="3"/>
    <rect x="310" y="290" width="40" height="55" rx="3"/>
    <rect x="370" y="290" width="40" height="55" rx="3"/>
  </g>
  <!-- Left Wing Windows (Row 2) -->
  <g fill="url(#glassGrad)">
    <rect x="130" y="370" width="40" height="55" rx="3"/>
    <rect x="190" y="370" width="40" height="55" rx="3"/>
    <rect x="250" y="370" width="40" height="55" rx="3"/>
    <rect x="310" y="370" width="40" height="55" rx="3"/>
    <rect x="370" y="370" width="40" height="55" rx="3"/>
  </g>

  <!-- Right Academic Wing -->
  <rect x="780" y="270" width="320" height="230" fill="url(#wallGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
  <polygon points="770,270 940,210 1110,270" fill="url(#roofGrad)" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>

  <!-- Right Wing Windows (Row 1) -->
  <g fill="url(#glassGrad)">
    <rect x="810" y="290" width="40" height="55" rx="3"/>
    <rect x="870" y="290" width="40" height="55" rx="3"/>
    <rect x="930" y="290" width="40" height="55" rx="3"/>
    <rect x="990" y="290" width="40" height="55" rx="3"/>
    <rect x="1050" y="290" width="40" height="55" rx="3"/>
  </g>
  <!-- Right Wing Windows (Row 2) -->
  <g fill="url(#glassGrad)">
    <rect x="810" y="370" width="40" height="55" rx="3"/>
    <rect x="870" y="370" width="40" height="55" rx="3"/>
    <rect x="930" y="370" width="40" height="55" rx="3"/>
    <rect x="990" y="370" width="40" height="55" rx="3"/>
    <rect x="1050" y="370" width="40" height="55" rx="3"/>
  </g>

  <!-- Central Main Administration & Academic Complex -->
  <rect x="380" y="210" width="440" height="290" fill="url(#wallGrad)" stroke="#67e8f9" stroke-width="2.5"/>

  <!-- Grand Central Pediment / Triangular Portico -->
  <polygon points="360,210 600,120 840,210" fill="url(#roofGrad)" stroke="#22d3ee" stroke-width="3"/>

  <!-- Pediment Medallion / Academy Crest -->
  <circle cx="600" cy="175" r="28" fill="#081538" stroke="#22d3ee" stroke-width="3"/>
  <text x="600" y="182" font-family="'Figtree', sans-serif" font-weight="900" font-size="16" fill="#67e8f9" text-anchor="middle">JK</text>

  <!-- Pediment Inscription -->
  <rect x="420" y="215" width="360" height="26" fill="#081538" rx="4" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="600" y="233" font-family="'Figtree', sans-serif" font-weight="900" font-size="12" fill="#22d3ee" letter-spacing="3" text-anchor="middle">J &amp; K DESIGNS ACADEMY</text>

  <!-- Clock Tower / Cupola Above -->
  <rect x="560" y="65" width="80" height="55" fill="#0f286b" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="550,65 600,20 650,65" fill="#22d3ee" stroke="#67e8f9" stroke-width="2"/>
  <circle cx="600" cy="92" r="16" fill="#081538" stroke="#bae6fd" stroke-width="2"/>
  <!-- Clock hands -->
  <line x1="600" y1="92" x2="600" y2="83" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  <line x1="600" y1="92" x2="607" y2="92" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>

  <!-- Grand Classical Pillars / Portico Columns (4 prominent pillars) -->
  <g fill="url(#wallPillar)" stroke="#0284c7" stroke-width="1">
    <!-- Pillar 1 -->
    <rect x="430" y="245" width="22" height="225" rx="2"/>
    <rect x="424" y="242" width="34" height="8" rx="2" fill="#e0f2fe"/>
    <rect x="422" y="465" width="38" height="12" rx="2" fill="#e0f2fe"/>
    <!-- Pillar 2 -->
    <rect x="510" y="245" width="22" height="225" rx="2"/>
    <rect x="504" y="242" width="34" height="8" rx="2" fill="#e0f2fe"/>
    <rect x="502" y="465" width="38" height="12" rx="2" fill="#e0f2fe"/>
    <!-- Pillar 3 -->
    <rect x="668" y="245" width="22" height="225" rx="2"/>
    <rect x="662" y="242" width="34" height="8" rx="2" fill="#e0f2fe"/>
    <rect x="660" y="465" width="38" height="12" rx="2" fill="#e0f2fe"/>
    <!-- Pillar 4 -->
    <rect x="748" y="245" width="22" height="225" rx="2"/>
    <rect x="742" y="242" width="34" height="8" rx="2" fill="#e0f2fe"/>
    <rect x="740" y="465" width="38" height="12" rx="2" fill="#e0f2fe"/>
  </g>

  <!-- Central 2nd Floor High-Tech Glass Atrium -->
  <rect x="550" y="255" width="100" height="95" fill="url(#glassGrad)" rx="6" stroke="#67e8f9" stroke-width="2"/>
  <line x1="600" y1="255" x2="600" y2="350" stroke="#081538" stroke-width="2"/>
  <line x1="550" y1="300" x2="650" y2="300" stroke="#081538" stroke-width="2"/>

  <!-- Main Grand Entrance Double Glass Doors -->
  <rect x="550" y="375" width="100" height="100" fill="#081538" stroke="#38bdf8" stroke-width="2"/>
  <rect x="555" y="385" width="42" height="90" fill="url(#glassGrad)" rx="2"/>
  <rect x="603" y="385" width="42" height="90" fill="url(#glassGrad)" rx="2"/>
  <!-- Door Handles -->
  <line x1="593" y1="435" x2="593" y2="450" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  <line x1="607" y1="435" x2="607" y2="450" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>

  <!-- Grand Entry Steps -->
  <polygon points="350,500 850,500 890,540 310,540" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="330,515 870,515 885,530 315,530" fill="#334155"/>
  <polygon points="310,530 890,530 905,545 295,545" fill="#1e293b"/>

  <!-- Landscaped Campus Grounds / Lawn -->
  <path d="M0,540 L1200,540 L1200,700 L0,700 Z" fill="url(#lawnGrad)"/>

  <!-- Modern Campus Entrance Driveway / Paved Plaza -->
  <polygon points="460,540 740,540 850,700 350,700" fill="url(#pathGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
  <!-- Plaza walkway guide lines -->
  <line x1="600" y1="540" x2="600" y2="700" stroke="#22d3ee" stroke-dasharray="10 8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Flagpole Left of Entrance (South African Flag colors accent) -->
  <line x1="280" y1="180" x2="280" y2="540" stroke="#e0f2fe" stroke-width="4"/>
  <circle cx="280" cy="180" r="5" fill="#facc15"/>
  <!-- Academy / SA Ensign Flag -->
  <polygon points="280,185 340,185 350,205 340,225 280,225" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="280,195 325,195 330,205 325,215 280,215" fill="#22d3ee"/>

  <!-- Ornamental Campus Trees / Landscaping -->
  <!-- Left Tree 1 -->
  <rect x="70" y="470" width="14" height="75" fill="#3f2e1e" rx="2"/>
  <ellipse cx="77" cy="450" rx="38" ry="48" fill="#047857" opacity="0.95"/>
  <ellipse cx="77" cy="440" rx="30" ry="38" fill="#10b981" opacity="0.85"/>
  <!-- Left Tree 2 -->
  <rect x="220" y="490" width="12" height="55" fill="#3f2e1e" rx="2"/>
  <ellipse cx="226" cy="475" rx="30" ry="38" fill="#065f46"/>
  <ellipse cx="226" cy="465" rx="24" ry="30" fill="#10b981" opacity="0.85"/>
  <!-- Right Tree 1 -->
  <rect x="980" y="490" width="12" height="55" fill="#3f2e1e" rx="2"/>
  <ellipse cx="986" cy="475" rx="30" ry="38" fill="#065f46"/>
  <ellipse cx="986" cy="465" rx="24" ry="30" fill="#10b981" opacity="0.85"/>
  <!-- Right Tree 2 -->
  <rect x="1120" y="470" width="14" height="75" fill="#3f2e1e" rx="2"/>
  <ellipse cx="1127" cy="450" rx="38" ry="48" fill="#047857" opacity="0.95"/>
  <ellipse cx="1127" cy="440" rx="30" ry="38" fill="#10b981" opacity="0.85"/>

  <!-- Campus Lighting Lampposts -->
  <g stroke="#67e8f9" stroke-width="2" fill="#22d3ee">
    <line x1="390" y1="460" x2="390" y2="540"/>
    <circle cx="390" cy="457" r="5"/>
    <line x1="810" y1="460" x2="810" y2="540"/>
    <circle cx="810" cy="457" r="5"/>
  </g>

  <!-- Campus Identity Badge Floating at Bottom Right -->
  <g transform="translate(740, 580)">
    <rect width="420" height="95" rx="16" fill="#081538" fill-opacity="0.95" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
    <circle cx="45" cy="47" r="28" fill="#0284c7" stroke="#67e8f9" stroke-width="2"/>
    <text x="45" y="54" font-family="'Figtree', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">JK</text>
    <text x="88" y="38" font-family="'Figtree', sans-serif" font-weight="900" font-size="16" fill="#ffffff">J &amp; K DESIGNS ACADEMY</text>
    <text x="88" y="58" font-family="'Figtree', sans-serif" font-weight="700" font-size="12" fill="#22d3ee">MAIN ACADEMIC CAMPUS BUILDING</text>
    <text x="88" y="76" font-family="'Figtree', sans-serif" font-weight="600" font-size="11" fill="#bae6fd">45 Brooklyn Street, Pretoria · Est. 2020</text>
  </g>
</svg>
