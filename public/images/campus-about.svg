<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d4d"/>
      <stop offset="50%" stop-color="#0f286b"/>
      <stop offset="100%" stop-color="#081538"/>
    </linearGradient>
    <linearGradient id="cardG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122b68"/>
      <stop offset="100%" stop-color="#081538"/>
    </linearGradient>
    <linearGradient id="cyanG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="20" fill="url(#bgG)"/>
  <rect x="3" y="3" width="794" height="494" rx="18" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Academy Architectural Outline in Background -->
  <g opacity="0.25" stroke="#67e8f9" stroke-width="1.5" fill="none">
    <polygon points="400,60 250,140 550,140"/>
    <rect x="260" y="140" width="280" height="180"/>
    <line x1="300" y1="140" x2="300" y2="320"/>
    <line x1="360" y1="140" x2="360" y2="320"/>
    <line x1="440" y1="140" x2="440" y2="320"/>
    <line x1="500" y1="140" x2="500" y2="320"/>
    <circle cx="400" cy="110" r="18"/>
  </g>

  <!-- Campus Header Tag -->
  <g transform="translate(40, 35)">
    <rect width="260" height="36" rx="18" fill="#081538" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="8" fill="#22d3ee"/>
    <text x="38" y="23" font-family="'Figtree', sans-serif" font-weight="900" font-size="12" fill="#bae6fd" letter-spacing="1">J &amp; K DESIGNS ACADEMY</text>
  </g>

  <!-- Feature Grid Inside Visual -->
  <g transform="translate(40, 95)">
    <!-- Card 1: Academic Excellence -->
    <rect x="0" y="0" width="220" height="110" rx="14" fill="url(#cardG)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="20" fill="#081538" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="36" y="42" font-family="'Font Awesome 6 Free', sans-serif" font-weight="900" font-size="16" fill="#22d3ee" text-anchor="middle">🎓</text>
    <text x="70" y="34" font-family="'Figtree', sans-serif" font-weight="900" font-size="14" fill="#ffffff">Top 1% Results</text>
    <text x="70" y="52" font-family="'Figtree', sans-serif" font-weight="600" font-size="11" fill="#bae6fd">100% Matric Pass Rate</text>
    <text x="20" y="90" font-family="'Figtree', sans-serif" font-weight="700" font-size="11" fill="#22d3ee">★ UMALUSI Accredited</text>

    <!-- Card 2: Science & Tech Labs -->
    <rect x="250" y="0" width="220" height="110" rx="14" fill="url(#cardG)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="286" cy="36" r="20" fill="#081538" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="286" y="42" font-family="'Font Awesome 6 Free', sans-serif" font-weight="900" font-size="16" fill="#22d3ee" text-anchor="middle">🔬</text>
    <text x="320" y="34" font-family="'Figtree', sans-serif" font-weight="900" font-size="14" fill="#ffffff">Advanced Labs</text>
    <text x="320" y="52" font-family="'Figtree', sans-serif" font-weight="600" font-size="11" fill="#bae6fd">Robotics, STEM &amp; CAT</text>
    <text x="270" y="90" font-family="'Figtree', sans-serif" font-weight="700" font-size="11" fill="#22d3ee">★ Modern Equipment</text>

    <!-- Card 3: Sports & Wellness -->
    <rect x="500" y="0" width="220" height="110" rx="14" fill="url(#cardG)" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="536" cy="36" r="20" fill="#081538" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="536" y="42" font-family="'Font Awesome 6 Free', sans-serif" font-weight="900" font-size="16" fill="#22d3ee" text-anchor="middle">🏆</text>
    <text x="570" y="34" font-family="'Figtree', sans-serif" font-weight="900" font-size="14" fill="#ffffff">Championships</text>
    <text x="570" y="52" font-family="'Figtree', sans-serif" font-weight="600" font-size="11" fill="#bae6fd">Inter-House Athletics</text>
    <text x="520" y="90" font-family="'Figtree', sans-serif" font-weight="700" font-size="11" fill="#22d3ee">★ Olympic Disciplines</text>
  </g>

  <!-- Big Interactive Campus Showcase Banner Inside -->
  <g transform="translate(40, 225)">
    <rect width="720" height="135" rx="16" fill="#081538" stroke="#22d3ee" stroke-width="2"/>
    <rect x="15" y="15" width="105" height="105" rx="12" fill="#0f286b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="67" y="75" font-family="'Figtree', sans-serif" font-weight="900" font-size="34" fill="#22d3ee" text-anchor="middle">🏫</text>

    <text x="135" y="48" font-family="'Figtree', sans-serif" font-weight="900" font-size="18" fill="#ffffff">Private Campus Grounds &amp; Facilities</text>
    <text x="135" y="72" font-family="'Figtree', sans-serif" font-weight="600" font-size="13" fill="#bae6fd">Modern architectural academic wings, auditorium, sports pavilions,</text>
    <text x="135" y="92" font-family="'Figtree', sans-serif" font-weight="600" font-size="13" fill="#bae6fd">digital media laboratories &amp; executive learning resource centre.</text>
    <text x="135" y="114" font-family="'Figtree', sans-serif" font-weight="800" font-size="12" fill="#67e8f9">📍 45 Brooklyn Street, Pretoria, South Africa</text>
  </g>

  <!-- Bottom Badges Row -->
  <g transform="translate(40, 385)">
    <rect width="340" height="85" rx="16" fill="url(#cyanG)"/>
    <text x="25" y="38" font-family="'Figtree', sans-serif" font-weight="900" font-size="24" fill="#020617">ESTABLISHED 2020</text>
    <text x="25" y="62" font-family="'Figtree', sans-serif" font-weight="800" font-size="13" fill="#0f172a">6+ Years of Private Educational Excellence</text>

    <g transform="translate(360, 0)">
      <rect width="360" height="85" rx="16" fill="#0f286b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="20" y="36" font-family="'Figtree', sans-serif" font-weight="900" font-size="15" fill="#ffffff">South African Registered &amp; Verified</text>
      <text x="20" y="58" font-family="'Figtree', sans-serif" font-weight="700" font-size="12" fill="#22d3ee">DBE: #400892 · IEB Partner · Pretoria Campus</text>
    </g>
  </g>
</svg>
